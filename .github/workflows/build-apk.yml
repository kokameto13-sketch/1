name: Build Weeqaya APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Weeqaya_Final_Release.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir project
          unzip -q Weeqaya_Final_Release.zip -d project

      - name: Find Gradle project
        run: |
          echo "Searching for gradlew..."
          find project -name gradlew -type f

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate and build APK
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found inside ZIP"
            echo "ZIP contents:"
            find project -maxdepth 5 -type f
            exit 1
          fi

          echo "Found Gradle wrapper: $GRADLEW"

          chmod +x "$GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find project -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Weeqaya-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
