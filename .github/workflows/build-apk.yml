name: Build Weeqaya APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Weeqaya_Final_Release_FIXED.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          echo "Files in repository:"
          ls -lah

          if [ ! -f "Weeqaya_Final_Release_FIXED.zip" ]; then
            echo "ERROR: Weeqaya_Final_Release_FIXED.zip not found"
            exit 1
          fi

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q Weeqaya_Final_Release_FIXED.zip -d project

          echo "Extracted files:"
          find project -maxdepth 4 -type f | sort

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show Gradle version
        run: |
          gradle --version

      - name: Build Debug APK
        working-directory: project
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Weeqaya-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
