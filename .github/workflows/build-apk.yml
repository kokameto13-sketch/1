name: Build Weeqaya APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Weeqaya_Final_Release_FIXED.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          echo "Checking repository files..."
          ls -lah

          if [ ! -f "Weeqaya_Final_Release_FIXED.zip" ]; then
            echo "ERROR: Weeqaya_Final_Release_FIXED.zip not found"
            exit 1
          fi

          echo "ZIP file found."

      - name: Extract project
        run: |
          rm -rf project
          mkdir -p project

          unzip -q Weeqaya_Final_Release_FIXED.zip -d project

          echo "Extracted files:"
          find project -maxdepth 5 -type f | sort

      - name: Check Android project
        run: |
          if [ ! -f "project/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found"
            find project -maxdepth 4 -type f | sort
            exit 1
          fi

          if [ ! -f "project/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          fi

          echo "Android project OK."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        run: |
          java -version

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show Gradle version
        run: |
          gradle --version

      - name: Show          echo "KOTLIN COMPILATION DIAGNOSTIC"
          echo "========================================"

          gradle :app:compileDebugKotlin \
            --info \
            --stacktrace \
            --console=plain

      - name: Build Debug APK
        working-directory: project
        run: |
          echo "========================================"
          echo "BUILDING DEBUG APK"
          echo "========================================"

          gradle :app:assembleDebug \
            --info \
            --stacktrace \
            --console=plain

      - name: Find APK
        if: success()
        run: |
          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find project -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Weeqaya-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build failed - show project information
        if: failure()
        working
