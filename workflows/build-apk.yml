name: Build Weeqaya APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Weeqaya_Final_Release.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q Weeqaya_Final_Release.zip -d project

      - name: Find Android project
        run: |
          echo "Project contents:"
          find project -maxdepth 3 -type f | head -100

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle executable
        run: |
          chmod +x project/gradlew

      - name: Build Debug APK
        working-directory: project
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Weeqaya-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
